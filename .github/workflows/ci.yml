name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: '21'

jobs:

  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Print toolchain versions
        run: |
          java -version
          mvn -version

  validate:
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  compile:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  unit-test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  integration-test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  coverage:
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test]
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  enforcer:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  spotbugs:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  sbom:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"

  package:
    runs-on: ubuntu-latest
    needs: [toolchain, validate, compile, unit-test, integration-test, coverage, enforcer, spotbugs, sbom, vulnerabilities, secrets, dependency-review, actionlint]
    steps:
      - uses: actions/checkout@v4
      - name: Test something
        run: echo "This job tests something"